services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-food-waste
    environment:
      ORACLE_PASSWORD: Oracle123!
      APP_USER: food_waste
      APP_USER_PASSWORD: FoodWaste123!
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d

volumes:
  oracle-data:
